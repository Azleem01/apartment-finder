name: Daily refresh

# Runs the scraper once a day and commits the refreshed data back to the repo.
# GitHub Pages (serving /docs) then shows the new listings within a minute.
# The daily commit also keeps this scheduled workflow from being auto-disabled.

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC daily
  workflow_dispatch:          # lets you run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        run: python -m scraper.pipeline

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data caches
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
