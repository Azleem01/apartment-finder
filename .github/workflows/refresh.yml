name: Hourly refresh

# Runs the scraper every hour and commits the refreshed data back to the repo,
# so a new SpareRoom ad that matches your criteria shows up on the site within
# the hour. GitHub Pages (serving /docs) then updates within a minute.

on:
  schedule:
    - cron: "0 * * * *"      # top of every hour (UTC)
  workflow_dispatch:          # lets you run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: hourly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        run: python -m scraper.pipeline

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data caches
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Hourly refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
